# =============================================
# Han Cloud 全量部署（大型）
# 适用: 生产环境 / 完整功能
# 硬件: 8核16GB
# 基础设施: PostgreSQL 18.1 + Redis 8.6 + Nacos 3.1.1 + RustFS
# 服务: gateway, auth, system, tenant, job, open, workflow, file, ai
# =============================================

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: han
  DB_USER: han
  DB_PASSWORD: han@2026

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: han@2026

x-nacos-env: &nacos-env
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: ""
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: han
  RABBITMQ_PASSWORD: han@2026

x-service-env: &service-env
  <<: [*db-env, *redis-env, *nacos-env, *rabbitmq-env]
  SPRING_PROFILES_ACTIVE: docker
  HAN_DEPLOY_TIER: full
  HAN_INNER_AUTH_SECRET: han-cloud-inner-auth
  JAVA_OPTS: -Xms256m -Xmx512m
  TZ: Asia/Shanghai

services:
  # ==================== 基础设施 ====================

  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/postgres:18.1
    container_name: han-postgres
    environment:
      POSTGRES_DB: han
      POSTGRES_USER: han
      POSTGRES_PASSWORD: han@2026
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/postgres/init-base-data.sql:/docker-entrypoint-initdb.d/02-base-data.sql
      - ./sql/han_ai.sql:/docker-entrypoint-initdb.d/03-ai.sql
      - ./sql/sys_oss_config.sql:/docker-entrypoint-initdb.d/04-oss.sql
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U han"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/redis:8.6.0
    container_name: han-redis
    command: redis-server --requirepass han@2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "han@2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/nacos:v3.1.1
    container_name: han-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "aGFuQDIwMjZoYW5AMjAyNmhhbkAyMDI2aGFuQDIwMjZoYW5AMjAyNg=="
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: han2026
      JVM_XMS: 512m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  rustfs:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/rustfs:1.0.0-alpha.81
    container_name: han-rustfs
    environment:
      RUSTFS_ACCESS_KEY: hanadmin
      RUSTFS_SECRET_KEY: han@2026
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - han-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: han-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: han
      RABBITMQ_DEFAULT_PASS: han@2026
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== 应用服务 ====================

  gateway:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/han-gateway:latest
    container_name: han-gateway
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: full
      HAN_INNER_AUTH_SECRET: han-cloud-inner-auth
      JAVA_OPTS: -Xms256m -Xmx512m -Dio.netty.transport.noNative=true
      TZ: Asia/Shanghai
    ports:
      - "9090:8080"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  auth:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/han-auth:latest
    container_name: han-auth
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: full
      HAN_INNER_AUTH_SECRET: han-cloud-inner-auth
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,
        org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  system:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/han-system:latest
    container_name: han-system
    environment:
      <<: *service-env
    ports:
      - "9201:9201"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  tenant:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/han-tenant:latest
    container_name: han-tenant
    environment:
      <<: *service-env
    ports:
      - "9202:9202"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  workflow:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/han-workflow:latest
    container_name: han-workflow
    environment:
      <<: *service-env
    ports:
      - "9203:9203"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  job:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/han-job:latest
    container_name: han-job
    environment:
      <<: *service-env
    ports:
      - "9204:9204"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  open:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/han-open:latest
    container_name: han-open
    environment:
      <<: *service-env
    ports:
      - "9205:9205"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  file:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/han-file:latest
    container_name: han-file
    environment:
      <<: [*db-env, *redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: full
      HAN_INNER_AUTH_SECRET: han-cloud-inner-auth
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: hanadmin
      RUSTFS_SECRET_KEY: han@2026
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9207:9207"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - han-network

  ai:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/han-ai:latest
    container_name: han-ai
    environment:
      <<: *service-env
    ports:
      - "9208:9208"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

volumes:
  postgres_data:
  redis_data:
  nacos_data:
  rustfs_data:
  rabbitmq_data:

networks:
  han-network:
    driver: bridge
