version: '3.8'


# =============================================
# han Cloud 中型部署 (标准版)
# 适用: 小团队/测试环境
# 硬件: 4核8GB
# 中间件: PostgreSQL + Redis + Nacos + RustFS + RabbitMQ
# 服务: 全部业务服务
# =============================================


services:
  # ==================== �м�� ====================

  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/postgres:18.1
    container_name: han-postgres
    environment:
      POSTGRES_DB: han
      POSTGRES_USER: han
      POSTGRES_PASSWORD: han@2026
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/han_ai.sql:/docker-entrypoint-initdb.d/02-ai.sql
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U han"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/redis:8.6-rc1
    container_name: han-redis
    command: redis-server --requirepass han@2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "han@2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/nacos-server:v2.3.2
    container_name: han-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 512m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  rustfs:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/rustfs:1.0.0-alpha.81
    container_name: han-rustfs
    environment:
      RUSTFS_ACCESS_KEY: hanadmin
      RUSTFS_SECRET_KEY: han@2026
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - han-network

  # rabbitmq: (TODO: 镜像暂不可用，异步消息队列为可选组件)
  #   image: rabbitmq:3-management-alpine
  #   container_name: han-rabbitmq
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"

  nacos-init:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/eclipse-temurin:21-jre-alpine
    container_name: han-nacos-init
    entrypoint: ["/bin/sh", "/scripts/init-nacos-config.sh"]
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: han
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: han@2026
    volumes:
      - ./nacos/init-nacos-config.sh:/scripts/init-nacos-config.sh:ro
      - ./nacos/configs:/configs:ro
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - han-network
    restart: "no"

  # ==================== 前端 (TODO: 单独部署) ====================

  # han-ui:
  #   build:
  #     context: ./han-ui
  #     dockerfile: Dockerfile
  #   container_name: han-ui
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - gateway
  #   networks:
  #     - han-network

  # ==================== 业务服务 ====================

  gateway:
    build:
      context: ./han-gateway
      dockerfile: Dockerfile
    container_name: han-gateway
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: han@2026
      NACOS_NAMESPACE: han
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - han-network

  auth:
    build:
      context: ./han-auth
      dockerfile: Dockerfile
    container_name: han-auth
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: han@2026
      NACOS_NAMESPACE: han
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: han
      DB_USER: han
      DB_PASSWORD: han@2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - han-network

  system:
    build:
      context: ./han-modules/han-system
      dockerfile: Dockerfile
    container_name: han-system
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: han@2026
      NACOS_NAMESPACE: han
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: han
      DB_USER: han
      DB_PASSWORD: han@2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9201:9201"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - han-network

  tenant:
    build:
      context: ./han-modules/han-tenant
      dockerfile: Dockerfile
    container_name: han-tenant
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: han@2026
      NACOS_NAMESPACE: han
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: han
      DB_USER: han
      DB_PASSWORD: han@2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9202:9202"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - han-network

  workflow:
    build:
      context: ./han-modules/han-workflow
      dockerfile: Dockerfile
    container_name: han-workflow
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: han@2026
      NACOS_NAMESPACE: han
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: han
      DB_USER: han
      DB_PASSWORD: han@2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9203:9203"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - han-network

  job:
    build:
      context: ./han-modules/han-job
      dockerfile: Dockerfile
    container_name: han-job
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: han@2026
      NACOS_NAMESPACE: han
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: han
      DB_USER: han
      DB_PASSWORD: han@2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9204:9204"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - han-network

  open:
    build:
      context: ./han-modules/han-open
      dockerfile: Dockerfile
    container_name: han-open
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: han@2026
      NACOS_NAMESPACE: han
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: han
      DB_USER: han
      DB_PASSWORD: han@2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9205:9205"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - han-network

  # gen: (TODO: 代码生成模块尚未实现)
  #   build:
  #     context: ./han-modules/han-gen
  #     dockerfile: Dockerfile
  #   container_name: han-gen
  #   ports:
  #     - "9206:9206"

  file:
    build:
      context: ./han-modules/han-file
      dockerfile: Dockerfile
    container_name: han-file
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: han@2026
      NACOS_NAMESPACE: han
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: hanadmin
      RUSTFS_SECRET_KEY: han@2026
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "9207:9207"
    depends_on:
      nacos:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - han-network

  # ai: (TODO: AI模块尚未创建)
  #   build:
  #     context: ./han-modules/han-ai
  #     dockerfile: Dockerfile
  #   container_name: han-ai
  #   ports:
  #     - "9208:9208"

volumes:
  postgres_data:
  redis_data:
  nacos_data:
  rustfs_data:
  rabbitmq_data:

networks:
  han-network:
    driver: bridge
