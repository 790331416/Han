server:
  port: 9100

spring:
  application:
    name: han-monitor
  security:
    user:
      # 监控中心登录凭据强制外部注入，不提供默认值：未配置环境变量时启动即失败，避免仓库内出现明文口令
      name: ${MONITOR_ADMIN_USERNAME}
      password: ${MONITOR_ADMIN_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: han
  boot:
    admin:
      ui:
        title: han监控中心
