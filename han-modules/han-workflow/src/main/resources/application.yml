server:
  port: 9205

spring:
  application:
    name: han-workflow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/han_flowable?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
    username: root
    password: root

# Flowable配置
flowable:
  # 关闭异步执行器(开发环境)
  async-executor-activate: false
  # 数据库表更新策略: true-自动创建/更新表
  database-schema-update: true
  # 历史记录级别: none/activity/audit/full
  history-level: audit
  # 关闭定时任务(使用XXL-JOB)
  async:
    executor:
      enabled: false
  # 流程定义缓存
  process-definition-cache-limit: 128
  # ID生成器使用UUID
  id-generator: uuid

# Nacos配置
spring.cloud:
  nacos:
    discovery:
      server-addr: localhost:8848
      namespace: han
    config:
      server-addr: localhost:8848
      namespace: han
      file-extension: yml

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.han.workflow.domain.entity
  configuration:
    map-underscore-to-camel-case: true
