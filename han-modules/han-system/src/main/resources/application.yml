server:
  port: 9201

spring:
  config:
    import:
      - "optional:nacos:application-shared.yml"
      - "optional:nacos:han-system.yml"
  application:
    name: han-system
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
        file-extension: yml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:han@2026}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:han}}
    username: ${DB_USER:han}
    password: ${DB_PASSWORD:han@2026}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000

han:
  deploy:
    tier: ${HAN_DEPLOY_TIER:medium}
  security:
    inner-auth:
      enabled: ${HAN_INNER_AUTH_ENABLED:true}
      secret: ${HAN_INNER_AUTH_SECRET:han-cloud-inner-auth}
      clock-skew-seconds: ${HAN_INNER_AUTH_CLOCK_SKEW_SECONDS:300}

sdfz:
  order:
    legacy:
      # disabled / jdbc / http。缺省不启用：订购单只在 Han 侧闭环，不往三课堂写听课记录。
      # 走 http 需要旧 api 先补齐内部接口，契约见 LegacyClassroomHttpGateway 类注释。
      channel: ${SDFZ_ORDER_LEGACY_CHANNEL:disabled}
      jdbc:
        url: ${SDFZ_ORDER_LEGACY_DB_URL:}
        username: ${SDFZ_ORDER_LEGACY_DB_USER:}
        password: ${SDFZ_ORDER_LEGACY_DB_PASSWORD:}
        maximum-pool-size: ${SDFZ_ORDER_LEGACY_DB_POOL_SIZE:4}
      http:
        base-url: ${SDFZ_ORDER_LEGACY_API_BASE_URL:}
        token: ${SDFZ_ORDER_LEGACY_API_TOKEN:}
    schedule:
      enabled: ${SDFZ_ORDER_SCHEDULE_ENABLED:true}
      lifecycle-cron: ${SDFZ_ORDER_LIFECYCLE_CRON:0 5 * * * ?}
      retry-cron: ${SDFZ_ORDER_RETRY_CRON:0 */10 * * * ?}
      reconcile-cron: ${SDFZ_ORDER_RECONCILE_CRON:0 30 3 * * ?}
    retry:
      max-attempts: ${SDFZ_ORDER_RETRY_MAX_ATTEMPTS:6}
      batch-size: ${SDFZ_ORDER_RETRY_BATCH_SIZE:200}
