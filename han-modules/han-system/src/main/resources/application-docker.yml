# Docker 环境配置 - System 专用（DB + Redis + Nacos）
server:
  port: 9201

spring:
  application:
    name: han-system
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:han}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:han}}
    username: ${DB_USER:han}
    password: ${DB_PASSWORD:han@2026}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:han@2026}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.han.system.domain.po
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 智慧校园契约兼容层。默认关闭，启用前必须先注入 token-secret 与匿名 AES 密钥，
# 匿名密钥取值须与旧客户端内置常量一致，不写进仓库。
sdfz:
  compat:
    enabled: ${SDFZ_COMPAT_ENABLED:false}
    tenant-id: ${SDFZ_COMPAT_TENANT_ID:1}
    token-secret: ${SDFZ_CLASSROOM_TOKEN_SECRET:}
    token-ttl-seconds: ${SDFZ_COMPAT_TOKEN_TTL_SECONDS:3600}
    interim-token-ttl-seconds: ${SDFZ_COMPAT_INTERIM_TOKEN_TTL_SECONDS:300}
    anonymous-key: ${SDFZ_COMPAT_ANONYMOUS_KEY:}
    anonymous-iv: ${SDFZ_COMPAT_ANONYMOUS_IV:}
    default-area-code: ${SDFZ_COMPAT_DEFAULT_AREA_CODE:620100}
    captcha-enabled: ${SDFZ_COMPAT_CAPTCHA_ENABLED:true}
    # 本期只放行教师登录；学生仍在兼容目录里可见，只是拿不到凭证
    login-person-types: ${SDFZ_COMPAT_LOGIN_PERSON_TYPES:TEACHER}

logging:
  level:
    root: INFO
    com.han: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
