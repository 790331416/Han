# Docker 环境配置 - System 专用（DB + Redis + Nacos）
server:
  port: 9201

spring:
  application:
    name: han-system
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:han}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:han}}
    username: ${DB_USER:han}
    password: ${DB_PASSWORD:han@2026}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:han@2026}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.han.system.domain.po
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

sdfz:
  order:
    legacy:
      channel: ${SDFZ_ORDER_LEGACY_CHANNEL:disabled}
      jdbc:
        url: ${SDFZ_ORDER_LEGACY_DB_URL:}
        username: ${SDFZ_ORDER_LEGACY_DB_USER:}
        password: ${SDFZ_ORDER_LEGACY_DB_PASSWORD:}
      http:
        base-url: ${SDFZ_ORDER_LEGACY_API_BASE_URL:}
        token: ${SDFZ_ORDER_LEGACY_API_TOKEN:}
    schedule:
      enabled: ${SDFZ_ORDER_SCHEDULE_ENABLED:true}

logging:
  level:
    root: INFO
    com.han: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
