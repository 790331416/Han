server:
  port: 9207
  forward-headers-strategy: framework

spring:
  application:
    name: han-file
  servlet:
    multipart:
      max-file-size: ${HAN_FILE_MAX_FILE_SIZE:300MB}
      max-request-size: ${HAN_FILE_MAX_REQUEST_SIZE:320MB}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:han}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:han}}
    username: ${DB_USER:han}
    password: ${DB_PASSWORD:han@2026}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:han@2026}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# 存储配置：具体 Endpoint、桶和密钥从数据库活动配置读取；主密钥仅来自受控环境变量或 Secret。
han:
  storage:
    type: s3
    master-key: ${HAN_STORAGE_MASTER_KEY:}

logging:
  level:
    root: INFO
    com.han: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
