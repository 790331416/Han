server:
  port: 9207
  forward-headers-strategy: framework

spring:
  application:
    name: han-file
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:han}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:han@2026}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# 存储配置
han:
  storage:
    type: rustfs
    rustfs:
      endpoint: ${RUSTFS_ENDPOINT:http://rustfs:9000}
      accessKey: ${RUSTFS_ACCESS_KEY:hanadmin}
      secretKey: ${RUSTFS_SECRET_KEY:han@2026}
      bucket: han

logging:
  level:
    root: INFO
    com.han: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
