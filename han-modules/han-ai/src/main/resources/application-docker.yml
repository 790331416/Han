server:
  port: 9208

spring:
  application:
    name: han-ai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:han}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:han}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
        file-extension: yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:han}}
    username: ${DB_USER:han}
    password: ${DB_PASSWORD:han@2026}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:han@2026}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.han.ai.domain.po
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

han:
  ai:
    document-storage-path: ${AI_DOCUMENT_STORAGE_PATH:/app/data/ai-documents}
    # SSRF 防护（G1-12）：默认拒绝内网/环回/链路本地/元数据地址；
    # 需放行容器网络内 MCP 服务时配置 allowed-hosts（主机名/通配后缀/IP/CIDR，逗号分隔）
    ssrf:
      enabled: ${AI_SSRF_ENABLED:true}
      allow-private-network: ${AI_SSRF_ALLOW_PRIVATE_NETWORK:false}
      allowed-hosts: ${AI_SSRF_ALLOWED_HOSTS:}

logging:
  level:
    root: INFO
    com.han: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
