# =============================================
# han Cloud 小型部署 (标准版)
# Nacos: 18848, Redis: 16379 (????????)
# =============================================

services:

  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/postgres:18.1
    container_name: han-postgres
    environment:
      POSTGRES_DB: han
      POSTGRES_USER: han
      POSTGRES_PASSWORD: han@2026
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U han"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/redis:6.2.14
    container_name: han-redis
    command: redis-server --requirepass han@2026
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "han@2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/nacos-server:v2.3.2
    container_name: han-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 256m
      JVM_XMX: 256m
      TZ: Asia/Shanghai
    ports:
      - "18848:8848"
      - "19848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8848/nacos/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Nacos 配置初始化
  nacos-init:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/eclipse-temurin:21-jre-alpine
    container_name: han-nacos-init
    entrypoint: ["/bin/sh", "/scripts/init-nacos-config.sh"]
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: han
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
    volumes:
      - ./nacos/init-nacos-config.sh:/scripts/init-nacos-config.sh:ro
      - ./nacos/configs:/configs:ro
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - han-network
    restart: "no"

  # ==================== 业务服务 ====================

  gateway:
    build:
      context: ./han-gateway
      dockerfile: Dockerfile
    container_name: han-gateway
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: han
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx256m
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - han-network

  auth:
    build:
      context: ./han-auth
      dockerfile: Dockerfile
    container_name: han-auth
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: han
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      SYSTEM_SERVICE_URL: http://system:9201
      JAVA_OPTS: -Xms256m -Xmx256m
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - han-network

  system:
    build:
      context: ./han-modules/han-system
      dockerfile: Dockerfile
    container_name: han-system
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: han
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: han
      DB_USER: han
      DB_PASSWORD: han@2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx256m
      TZ: Asia/Shanghai
    ports:
      - "9201:9201"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - han-network

  job:
    build:
      context: ./han-modules/han-job
      dockerfile: Dockerfile
    container_name: han-job
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9204/actuator/health || curl -sf http://localhost:9204/actuator/health || nc -z localhost 9204"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: han
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: han
      DB_USER: han
      DB_PASSWORD: han@2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx256m
      TZ: Asia/Shanghai
    ports:
      - "9204:9204"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - han-network

volumes:
  postgres_data:
  redis_data:
  nacos_data:

networks:
  han-network:
    driver: bridge
