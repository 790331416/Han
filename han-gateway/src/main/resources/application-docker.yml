# Docker 环境配置 - Gateway 专用（Nacos 服务发现 + lb:// 路由）
server:
  port: 8080

spring:
  application:
    name: han-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:han}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
    gateway:
      server:
        webflux:
          routes:
            - id: han-auth
              uri: lb://han-auth
              predicates:
                - Path=/auth/**
            - id: han-system
              uri: lb://han-system
              predicates:
                - Path=/system/**
            - id: han-tenant
              uri: lb://han-tenant
              predicates:
                - Path=/tenant/**
            - id: han-job
              uri: lb://han-job
              predicates:
                - Path=/job/**
            - id: han-open
              uri: lb://han-open
              predicates:
                - Path=/open/**,/oauth2/**,/sso/**
            - id: han-file
              uri: lb://han-file
              predicates:
                - Path=/file/**
            - id: han-gen
              uri: lb://han-gen
              predicates:
                - Path=/gen/**
            - id: han-workflow
              uri: lb://han-workflow
              predicates:
                - Path=/workflow/**
            - id: han-ai
              uri: lb://han-ai
              predicates:
                - Path=/ai/**
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:han@2026}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

logging:
  level:
    root: INFO
    com.han: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
