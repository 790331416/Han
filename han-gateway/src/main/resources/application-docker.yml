# Docker 环境配置 - Gateway 专用（Nacos 服务发现 + lb:// 路由）
server:
  port: 8080

spring:
  application:
    name: han-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:han}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
    gateway:
      server:
        webflux:
          trusted-proxies: ${SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTED_PROXIES:.*}
          routes:
            - id: han-auth
              uri: lb://han-auth
              predicates:
                - Path=/auth/**
            - id: han-system
              uri: lb://han-system
              predicates:
                - Path=/system/**
            - id: han-tenant
              uri: lb://han-tenant
              predicates:
                - Path=/tenant/**
            - id: han-job
              uri: lb://han-job
              predicates:
                - Path=/job/**,/actuator/jobflow/**
            - id: han-open
              uri: lb://han-open
              predicates:
                - Path=/open/**,/oauth2/**,/sso/**
            - id: han-file
              uri: lb://han-file
              predicates:
                - Path=/file/**
            - id: han-gen
              uri: lb://han-gen
              predicates:
                - Path=/gen/**
            - id: han-workflow
              uri: lb://han-workflow
              predicates:
                - Path=/workflow/**
            - id: han-ai
              uri: lb://han-ai
              predicates:
                - Path=/ai/**
            - id: han-aivideo
              uri: lb://han-aivideo
              predicates:
                - Path=/aivideo/**
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

logging:
  level:
    root: INFO
    com.han: INFO

# 网关自身的 actuator 端点由 WebFluxEndpointHandlerMapping 抢在路由匹配之前接管，
# 不经过 AuthFilter 白名单判断，等于对网关端口的访问者裸奔。因此默认收敛：
# 不暴露 metrics（含各接口 QPS、错误率、JVM 内存等运营数据），health 不展开明细。
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
