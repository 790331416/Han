server:
  port: 8080

spring:
  application:
    name: han-gateway
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
    gateway:
      server:
        webflux:
          trusted-proxies: ${SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTED_PROXIES:.*}
          routes:
            - id: han-auth
              uri: lb://han-auth
              predicates:
                - Path=/auth/**
            - id: han-system
              uri: lb://han-system
              predicates:
                - Path=/system/**
            - id: han-tenant
              uri: lb://han-tenant
              predicates:
                - Path=/tenant/**
            - id: han-job
              uri: lb://han-job
              predicates:
                - Path=/job/**,/actuator/jobflow/**
            - id: han-open
              uri: lb://han-open
              predicates:
                - Path=/open/**,/oauth2/**,/sso/**
            - id: han-file
              uri: lb://han-file
              predicates:
                - Path=/file/**
            - id: han-workflow
              uri: lb://han-workflow
              predicates:
                - Path=/workflow/**
            - id: han-ai
              uri: lb://han-ai
              predicates:
                - Path=/ai/**
            - id: han-aivideo
              uri: lb://han-aivideo
              predicates:
                - Path=/aivideo/**
            - id: three-classroom-legacy-relay
              uri: ${SDFZ_THREE_CLASSROOM_GATEWAY_URI:lb://three-classroom-gateway}
              predicates:
                - Path=/tcapi/**,/ysfz-tcapi/**
            # 智慧校园契约兼容目录：旧 api 的 api.url 与旧前端 /api 反代都指到这里
            - id: sdfz-legacy-compat
              uri: lb://han-system
              predicates:
                - Path=/sdfz-compat/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:han@2026}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

han:
  deploy:
    tier: ${HAN_DEPLOY_TIER:medium}

sdfz:
  classroom-gateway:
    enabled: ${SDFZ_CLASSROOM_GATEWAY_ENABLED:false}
    token-secret: ${SDFZ_CLASSROOM_TOKEN_SECRET:}
    exchange-uri: ${SDFZ_CLASSROOM_TOKEN_EXCHANGE_URI:http://han-auth/auth/external/digital-campus/classroom-token}
