# Docker 环境配置模板（PostgreSQL 版本）
# 复制此文件到各个模块的 src/main/resources/ 目录，命名为 application-docker.yml

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:han-service}
  
  # PostgreSQL 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:han}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${POSTGRES_USER:han}
    password: ${POSTGRES_PASSWORD:han@2026}
    
    # HikariCP 连接池配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
  
  # Redis 配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:han@2026}
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1
  
  # Nacos 配置中心
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:han}
        password: ${NACOS_PASSWORD:han@2026}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:han}
        password: ${NACOS_PASSWORD:han@2026}
        file-extension: yml
        namespace: ${NACOS_NAMESPACE:}
        shared-configs:
          - data-id: jobflow-scheduler.yml
            group: DEFAULT_GROUP
            refresh: true

# 存储配置
han:
  storage:
    type: rustfs
    rustfs:
      endpoint: ${RUSTFS_ENDPOINT:http://localhost:9000}
      accessKey: ${RUSTFS_ACCESS_KEY:hanadmin}
      secretKey: ${RUSTFS_SECRET_KEY:han@2026}
      bucket: han

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.han.*.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.han: INFO
    com.han.job.shard: DEBUG
    com.han.job.lock: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{jobId}] [%X{shardIndex}] %-5level %logger{50} - %msg%n'

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
