# Docker 环境配置 - Auth 专用（无数据库，Redis + Nacos）
server:
  port: 9200

spring:
  application:
    name: han-auth
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:han}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:han@2026}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

logging:
  level:
    root: INFO
    com.han: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

sdfz:
  digital-campus:
    enabled: ${SDFZ_DIGITAL_CAMPUS_ENABLED:false}
    api-base-url: ${SDFZ_DIGITAL_CAMPUS_API_BASE_URL:}
    allowed-role-types: ${SDFZ_DIGITAL_CAMPUS_ALLOWED_ROLE_TYPES:2,5}
    tenant-id: ${SDFZ_DIGITAL_CAMPUS_TENANT_ID:1}
