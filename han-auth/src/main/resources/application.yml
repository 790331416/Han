server:
  port: 9200

spring:
  config:
    import:
      - "optional:nacos:application-shared.yml"
      - "optional:nacos:han-auth.yml"
  application:
    name: han-auth
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:han@2026}
        file-extension: yml

han:
  deploy:
    tier: ${HAN_DEPLOY_TIER:medium}
  security:
    inner-auth:
      enabled: ${HAN_INNER_AUTH_ENABLED:true}
      secret: ${HAN_INNER_AUTH_SECRET:han-cloud-inner-auth}
      clock-skew-seconds: ${HAN_INNER_AUTH_CLOCK_SKEW_SECONDS:300}

sdfz:
  digital-campus:
    enabled: ${SDFZ_DIGITAL_CAMPUS_ENABLED:false}
    api-base-url: ${SDFZ_DIGITAL_CAMPUS_API_BASE_URL:}
    allowed-role-types: ${SDFZ_DIGITAL_CAMPUS_ALLOWED_ROLE_TYPES:2,5}
