server:
  port: 9206

spring:
  application:
    name: xuman-open
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xuman?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

# Nacos配置
spring.cloud:
  nacos:
    discovery:
      server-addr: localhost:8848
      namespace: xuman
    config:
      server-addr: localhost:8848
      namespace: xuman
      file-extension: yml

# Redis配置(OAuth2 Token存储)
spring.data:
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.xuman.open.domain.entity
  configuration:
    map-underscore-to-camel-case: true

# 开放平台配置
xuman:
  open:
    # 授权码有效期(秒)
    authorization-code-ttl: 300
    # AccessToken有效期(秒)
    access-token-ttl: 3600
    # RefreshToken有效期(秒)
    refresh-token-ttl: 604800
    # 是否允许PKCE
    require-pkce: false
