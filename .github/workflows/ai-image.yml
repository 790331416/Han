name: ai-image

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: Push han-ai:latest in addition to the commit tag
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - master
      - main
    paths:
      - "han-api/han-api-ai/**"
      - "han-common/**"
      - "han-modules/pom.xml"
      - "han-modules/han-ai/**"
      - "pom.xml"
      - "settings.workspace.xml"
      - ".github/workflows/ai-image.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: xzy0112
  # 允许推送 :latest 的发布分支白名单，与 full-app-image.yml 保持同一口径。
  PUSH_LATEST_BRANCHES: "master,main"
  AI_IMAGE_NAME: han-ai

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 门禁开关说明见 .github/workflows/full-app-image.yml 的 test job。
    continue-on-error: ${{ vars.HAN_CI_TEST_GATE != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -gs settings.workspace.xml -pl han-modules/han-ai -am test

  build-ai:
    name: Build and push han-ai image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      # 原来是就地复制的一段重试逻辑，且第 4 次兜底丢掉了
      # -gs settings.workspace.xml，同一个 job 里出现两种依赖解析配置。
      # 改为调用与其它 10 个镜像 job 相同的脚本，参数完全一致。
      - name: Package han-ai
        run: bash scripts/helpers/maven-package-with-retry.sh han-modules/han-ai

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          INPUT_PUSH_LATEST: ${{ inputs.push_latest || 'false' }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${AI_IMAGE_NAME}"
          push_latest="false"

          # :latest 只允许来自 PUSH_LATEST_BRANCHES 里的发布分支，单一口径，
          # 避免十处复制粘贴各自漂移，也避免特性分支覆盖通用服务的 :latest。
          if [[ ",${PUSH_LATEST_BRANCHES}," != *",${GITHUB_REF_NAME},"* ]]; then
            push_latest="false"
            echo "::notice::${GITHUB_REF_NAME} is not a release branch; :latest will not be pushed"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            push_latest="${INPUT_PUSH_LATEST}"
          else
            push_latest="true"
          fi

          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${push_latest}" >> "${GITHUB_OUTPUT}"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"

          docker build \
            --pull \
            --network=host \
            -t "${image}:${short_sha}" \
            -t "${image}:latest" \
            han-modules/han-ai

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          push_latest="${{ steps.meta.outputs.push_latest }}"

          docker push "${image}:${short_sha}"
          if [[ "${push_latest}" == "true" ]]; then
            docker push "${image}:latest"
          fi

      - name: Verify remote manifests
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          push_latest="${{ steps.meta.outputs.push_latest }}"

          docker manifest inspect "${image}:${short_sha}" >/dev/null
          if [[ "${push_latest}" == "true" ]]; then
            docker manifest inspect "${image}:latest" >/dev/null
          fi
