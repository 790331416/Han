name: aivideo-image

# Builds the tested AIVideo backend and standalone UI release images.

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: Push latest image tags in addition to the commit tag
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      sync_rabbitmq:
        description: Mirror rabbitmq:3.13-management to the ACR namespace
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - master
      - aivideo
      - "feature/aivideo-*"
    paths:
      - "han-api/han-api-ai/**"
      - "han-api/han-api-file/**"
      - "han-common/**"
      - "han-modules/pom.xml"
      - "han-modules/han-ai/**"
      - "han-modules/han-aivideo/**"
      - "han-aivideo-ui/**"
      - "pom.xml"
      - "settings.workspace.xml"
      - "scripts/helpers/maven-package-with-retry.sh"
      - ".github/workflows/aivideo-image.yml"

permissions:
  contents: read

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: xzy0112
  AI_IMAGE_NAME: han-ai
  AIVIDEO_IMAGE_NAME: han-aivideo
  AIVIDEO_UI_IMAGE_NAME: han-aivideo-ui
  RABBITMQ_SOURCE_IMAGE: rabbitmq:3.13-management
  RABBITMQ_TARGET_IMAGE: rabbitmq:3.13-management

jobs:
  build-aivideo:
    name: Test, build and push han-ai and han-aivideo images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Test han-ai and han-aivideo
        run: mvn -B -gs settings.workspace.xml -pl han-modules/han-ai,han-modules/han-aivideo -am test

      - name: Package han-ai and han-aivideo with mirror retry
        run: bash scripts/helpers/maven-package-with-retry.sh han-modules/han-ai,han-modules/han-aivideo

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          INPUT_PUSH_LATEST: ${{ inputs.push_latest || 'false' }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          ai_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${AI_IMAGE_NAME}"
          aivideo_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${AIVIDEO_IMAGE_NAME}"
          push_latest="false"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            push_latest="${INPUT_PUSH_LATEST}"
          elif [[ "${GITHUB_REF_NAME}" == "master" || "${GITHUB_REF_NAME}" == "aivideo" ]]; then
            push_latest="true"
          fi

          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "ai_image=${ai_image}" >> "${GITHUB_OUTPUT}"
          echo "aivideo_image=${aivideo_image}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${push_latest}" >> "${GITHUB_OUTPUT}"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build images
        shell: bash
        run: |
          set -euo pipefail
          ai_image="${{ steps.meta.outputs.ai_image }}"
          aivideo_image="${{ steps.meta.outputs.aivideo_image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"

          docker build \
            --pull \
            --network=host \
            -t "${ai_image}:${short_sha}" \
            -t "${ai_image}:latest" \
            han-modules/han-ai

          docker build \
            --pull \
            --network=host \
            -t "${aivideo_image}:${short_sha}" \
            -t "${aivideo_image}:latest" \
            han-modules/han-aivideo

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          ai_image="${{ steps.meta.outputs.ai_image }}"
          aivideo_image="${{ steps.meta.outputs.aivideo_image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          push_latest="${{ steps.meta.outputs.push_latest }}"

          docker push "${ai_image}:${short_sha}"
          docker push "${aivideo_image}:${short_sha}"
          if [[ "${push_latest}" == "true" ]]; then
            docker push "${ai_image}:latest"
            docker push "${aivideo_image}:latest"
          fi

      - name: Verify remote manifests
        shell: bash
        run: |
          set -euo pipefail
          ai_image="${{ steps.meta.outputs.ai_image }}"
          aivideo_image="${{ steps.meta.outputs.aivideo_image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          push_latest="${{ steps.meta.outputs.push_latest }}"

          docker manifest inspect "${ai_image}:${short_sha}" >/dev/null
          docker manifest inspect "${aivideo_image}:${short_sha}" >/dev/null
          if [[ "${push_latest}" == "true" ]]; then
            docker manifest inspect "${ai_image}:latest" >/dev/null
            docker manifest inspect "${aivideo_image}:latest" >/dev/null
          fi

  build-aivideo-ui:
    name: Build and push han-aivideo-ui image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          INPUT_PUSH_LATEST: ${{ inputs.push_latest || 'false' }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${AIVIDEO_UI_IMAGE_NAME}"
          push_latest="false"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            push_latest="${INPUT_PUSH_LATEST}"
          elif [[ "${GITHUB_REF_NAME}" == "master" || "${GITHUB_REF_NAME}" == "aivideo" ]]; then
            push_latest="true"
          fi

          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${push_latest}" >> "${GITHUB_OUTPUT}"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"

          docker build \
            --pull \
            --network=host \
            -t "${image}:${short_sha}" \
            -t "${image}:latest" \
            han-aivideo-ui

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          push_latest="${{ steps.meta.outputs.push_latest }}"

          docker push "${image}:${short_sha}"
          if [[ "${push_latest}" == "true" ]]; then
            docker push "${image}:latest"
          fi

      - name: Verify remote manifests
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          push_latest="${{ steps.meta.outputs.push_latest }}"

          docker manifest inspect "${image}:${short_sha}" >/dev/null
          if [[ "${push_latest}" == "true" ]]; then
            docker manifest inspect "${image}:latest" >/dev/null
          fi

  mirror-rabbitmq:
    name: Mirror RabbitMQ image to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_rabbitmq == 'true' }}

    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull, tag, push RabbitMQ
        shell: bash
        run: |
          set -euo pipefail
          source_image="${RABBITMQ_SOURCE_IMAGE}"
          target_image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${RABBITMQ_TARGET_IMAGE}"

          docker pull "${source_image}"
          docker tag "${source_image}" "${target_image}"
          docker push "${target_image}"
          docker manifest inspect "${target_image}" >/dev/null
