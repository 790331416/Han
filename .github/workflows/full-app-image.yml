name: full-app-image

# Release trigger note: MVP2 scene image workflow requires fresh han-system, han-file and han-ui images.

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: Push latest tags in addition to the commit tag
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - master
      - main
      - feature/aivideo-mvp1-text
    paths:
      - "han-gateway/**"
      - "han-ui/**"
      - "han-auth/**"
      - "han-api/han-api-file/**"
      - "han-api/han-api-system/**"
      - "han-api/han-api-tenant/**"
      - "han-common/**"
      - "han-modules/han-ai/**"
      - "han-modules/han-aivideo/**"
      - "han-modules/han-file/**"
      - "han-modules/han-system/**"
      - "han-modules/han-tenant/**"
      - "han-modules/han-job/**"
      - "han-modules/han-workflow/**"
      - "han-modules/han-open/**"
      - "han-modules/han-gen/**"
      - "han-starter/**"
      - "pom.xml"
      - "settings.workspace.xml"
      - ".github/workflows/aivideo-image.yml"
      - ".github/workflows/full-app-image.yml"

permissions:
  contents: read

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: xzy0112
  FILE_IMAGE_NAME: han-file
  GATEWAY_IMAGE_NAME: han-gateway
  SYSTEM_IMAGE_NAME: han-system
  TENANT_IMAGE_NAME: han-tenant
  UI_IMAGE_NAME: han-ui
  AUTH_IMAGE_NAME: han-auth
  JOB_IMAGE_NAME: han-job
  WORKFLOW_IMAGE_NAME: han-workflow
  OPEN_IMAGE_NAME: han-open
  GEN_IMAGE_NAME: han-gen

jobs:
  build-file:
    name: Build and push han-file image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Package han-file
        run: bash scripts/helpers/maven-package-with-retry.sh han-modules/han-file

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          INPUT_PUSH_LATEST: ${{ inputs.push_latest || 'false' }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${FILE_IMAGE_NAME}"
          push_latest="false"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            push_latest="${INPUT_PUSH_LATEST}"
          elif [[ "${GITHUB_REF_NAME}" == "master" || "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "feature/aivideo-mvp1-text" ]]; then
            push_latest="true"
          fi

          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${push_latest}" >> "${GITHUB_OUTPUT}"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"

          docker build \
            --pull \
            --network=host \
            -t "${image}:${short_sha}" \
            -t "${image}:latest" \
            han-modules/han-file

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          push_latest="${{ steps.meta.outputs.push_latest }}"

          docker push "${image}:${short_sha}"
          if [[ "${push_latest}" == "true" ]]; then
            docker push "${image}:latest"
          fi

      - name: Verify remote manifests
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          push_latest="${{ steps.meta.outputs.push_latest }}"

          docker manifest inspect "${image}:${short_sha}" >/dev/null
          if [[ "${push_latest}" == "true" ]]; then
            docker manifest inspect "${image}:latest" >/dev/null
          fi

