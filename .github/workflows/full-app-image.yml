name: full-app-image

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: Push latest tags in addition to the commit tag
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - master
      - main
    paths:
      - "han-gateway/**"
      - "han-ui/**"
      - "han-auth/**"
      - "han-api/han-api-file/**"
      - "han-api/han-api-system/**"
      - "han-api/han-api-tenant/**"
      - "han-common/**"
      - "han-modules/han-ai/**"
      - "han-modules/han-file/**"
      - "han-modules/han-system/**"
      - "han-modules/han-tenant/**"
      - "han-modules/han-job/**"
      - "han-modules/han-workflow/**"
      - "han-modules/han-open/**"
      - "han-modules/han-gen/**"
      - "han-aivideo-ui/**"
      - "han-modules/han-aivideo/**"
      - "han-starter/**"
      - "pom.xml"
      - "settings.workspace.xml"
      - ".github/workflows/full-app-image.yml"

permissions:
  contents: read

# 同一分支上短时间内连续两次 push 会有两个 run 并行推同一个 :latest，
# 最终指向哪个 commit 取决于竞态。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_NAMESPACE: xzy0112
  # 允许推送 :latest 的发布分支白名单，逗号分隔，是全 workflow 的唯一口径。
  # docs/05-运维与95环境手册.md:24 要求 95 正式版本只能来自 master 提交。
  PUSH_LATEST_BRANCHES: "master,main"
  FILE_IMAGE_NAME: han-file
  GATEWAY_IMAGE_NAME: han-gateway
  SYSTEM_IMAGE_NAME: han-system
  TENANT_IMAGE_NAME: han-tenant
  UI_IMAGE_NAME: han-ui
  AUTH_IMAGE_NAME: han-auth
  JOB_IMAGE_NAME: han-job
  WORKFLOW_IMAGE_NAME: han-workflow
  OPEN_IMAGE_NAME: han-open
  GEN_IMAGE_NAME: han-gen
  AIVIDEO_UI_IMAGE_NAME: han-aivideo-ui

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # docs/03-部署手册.md:357 与 docs/05-运维与95环境手册.md:25 都把「Actions 测试
    # 通过」写成 95 发布的前置条件，但此前所有镜像 job 只有 package 一步且写死
    # -DskipTests，全流程没有任何测试。这个 job 让测试真的跑起来。
    #
    # 是否阻断由仓库变量 HAN_CI_TEST_GATE 控制：
    #   未设置或非 true  测试照跑、结果可见，但失败不阻断镜像构建（观察期）
    #   设为 true        测试失败直接阻断全部镜像构建（正式门禁）
    # 现状是 han-common 9 个模块零单元测试，开硬门禁前需要先补测试，
    # 所以默认留在观察期，切换时机由发布负责人决定。
    continue-on-error: ${{ vars.HAN_CI_TEST_GATE != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -gs settings.workspace.xml test

      - name: Report gate mode
        if: always()
        shell: bash
        run: |
          if [[ "${{ vars.HAN_CI_TEST_GATE }}" == "true" ]]; then
            echo "test gate: enforcing (failures block image builds)" >>"${GITHUB_STEP_SUMMARY}"
          else
            echo "test gate: observation only (set repository variable HAN_CI_TEST_GATE=true to enforce)" >>"${GITHUB_STEP_SUMMARY}"
          fi

  build-file:
    name: Build and push han-file image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Package han-file
        run: bash scripts/helpers/maven-package-with-retry.sh han-modules/han-file

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          INPUT_PUSH_LATEST: ${{ inputs.push_latest || 'false' }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          image="${ACR_REGISTRY}/${ACR_NAMESPACE}/${FILE_IMAGE_NAME}"
          push_latest="false"

          # :latest 只允许来自 PUSH_LATEST_BRANCHES 里的发布分支，单一口径，
          # 避免十处复制粘贴各自漂移，也避免特性分支覆盖通用服务的 :latest。
          if [[ ",${PUSH_LATEST_BRANCHES}," != *",${GITHUB_REF_NAME},"* ]]; then
            push_latest="false"
            echo "::notice::${GITHUB_REF_NAME} is not a release branch; :latest will not be pushed"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            push_latest="${INPUT_PUSH_LATEST}"
          else
            push_latest="true"
          fi

          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${push_latest}" >> "${GITHUB_OUTPUT}"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"

          docker build \
            --pull \
            --network=host \
            -t "${image}:${short_sha}" \
            -t "${image}:latest" \
            han-modules/han-file

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          push_latest="${{ steps.meta.outputs.push_latest }}"

          docker push "${image}:${short_sha}"
          if [[ "${push_latest}" == "true" ]]; then
            docker push "${image}:latest"
          fi

      - name: Verify remote manifests
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"
          push_latest="${{ steps.meta.outputs.push_latest }}"

          docker manifest inspect "${image}:${short_sha}" >/dev/null
          if [[ "${push_latest}" == "true" ]]; then
            docker manifest inspect "${image}:latest" >/dev/null
          fi

