# =============================================
# JobFlow 调度器配置（Nacos Config）
# Data ID: jobflow-scheduler.yml
# Group: DEFAULT_GROUP
# =============================================

jobflow:
  scheduler:
    # 调度线程池大小（动态调整，不重启生效）
    thread-pool-size: 20
    
    # 默认超时时间（秒）
    timeout: 300
    
    # 默认重试次数
    max-retry: 3
    
    # HTTP 超时配置
    connect-timeout: 5000  # 连接超时（毫秒）
    read-timeout: 30000    # 读取超时（毫秒）
    
    # 分片锁超时时间（秒）
    lock-timeout: 60
    
    # 补偿任务配置
    compensation-enabled: true          # 是否启用补偿任务
    compensation-interval: 60000        # 补偿任务间隔（毫秒）
    stuck-threshold: 600000             # 卡住阈值（10分钟）

# =============================================
# 配置说明
# =============================================
# 1. 动态调整线程池大小
#    业务高峰期：thread-pool-size: 50
#    业务低峰期：thread-pool-size: 20
#    Nacos 控制台修改后，立即生效，无需重启
#
# 2. 调整超时时间
#    长时任务：timeout: 600（10分钟）
#    短时任务：timeout: 60（1分钟）
#
# 3. 多实例共享配置
#    部署 3 个调度器实例，改一次配置，所有实例都生效
#
# 4. 版本管理和回滚
#    Nacos 支持配置版本管理，可一键回滚到上一个版本
# =============================================
