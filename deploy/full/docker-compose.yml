x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: han
  DB_USER: han
  DB_PASSWORD: ${POSTGRES_PASSWORD:-han@2026}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-han@2026}

x-nacos-env: &nacos-env
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: ""
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: han
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-han@2026}

x-service-env: &service-env
  <<: [*db-env, *redis-env, *nacos-env, *rabbitmq-env]
  SPRING_PROFILES_ACTIVE: docker
  HAN_DEPLOY_TIER: full
  HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:-han-cloud-inner-auth}
  JAVA_OPTS: -Xms256m -Xmx512m
  TZ: ${TZ:-Asia/Shanghai}

services:
  postgres:
    image: ${HAN_POSTGRES_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/postgres:18.1}
    environment:
      POSTGRES_DB: han
      POSTGRES_USER: han
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-han@2026}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ${HAN_SQL_ROOT:-../../sql}/tiers/full/full-init.sql:/docker-entrypoint-initdb.d/01-full-init.sql:ro
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U han"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${HAN_REDIS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/redis:8.6.0}
    command: redis-server --requirepass ${REDIS_PASSWORD:-han@2026}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-han@2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: ${HAN_NACOS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/nacos:v3.1.1}
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "aGFuQDIwMjZoYW5AMjAyNmhhbkAyMDI2aGFuQDIwMjZoYW5AMjAyNg=="
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: han2026
      JVM_XMS: 512m
      JVM_XMX: 512m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  rustfs:
    image: ${HAN_RUSTFS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/rustfs:1.0.0-alpha.81}
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-hanadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-han@2026}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  rabbitmq:
    image: ${HAN_RABBITMQ_IMAGE:-rabbitmq:3.13-management}
    environment:
      RABBITMQ_DEFAULT_USER: han
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-han@2026}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    image: ${HAN_GATEWAY_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-gateway:latest}
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTED_PROXIES: .*
      HAN_DEPLOY_TIER: full
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:-han-cloud-inner-auth}
      JAVA_OPTS: -Xms256m -Xmx512m -Dio.netty.transport.noNative=true
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "9090:8080"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  auth:
    image: ${HAN_AUTH_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-auth:latest}
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: full
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:-han-cloud-inner-auth}
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,
        org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "9200:9200"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  system:
    image: ${HAN_SYSTEM_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-system:latest}
    environment:
      <<: *service-env
      HAN_GEN_ENABLED: "true"
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-hanadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-han@2026}
    ports:
      - "9201:9201"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  tenant:
    image: ${HAN_TENANT_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-tenant:latest}
    environment:
      <<: *service-env
    ports:
      - "9202:9202"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  workflow:
    image: ${HAN_WORKFLOW_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-workflow:latest}
    environment:
      <<: *service-env
    ports:
      - "9203:9203"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  job:
    image: ${HAN_JOB_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-job:latest}
    environment:
      <<: *service-env
    ports:
      - "9204:9204"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  open:
    image: ${HAN_OPEN_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-open:latest}
    environment:
      <<: *service-env
    ports:
      - "9205:9205"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  file:
    image: ${HAN_FILE_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-file:latest}
    environment:
      <<: [*db-env, *redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: full
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:-han-cloud-inner-auth}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-hanadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-han@2026}
      HAN_FILE_MAX_FILE_SIZE: ${HAN_FILE_MAX_FILE_SIZE:-300MB}
      HAN_FILE_MAX_REQUEST_SIZE: ${HAN_FILE_MAX_REQUEST_SIZE:-320MB}
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "9207:9207"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - han-network

  ai:
    image: ${HAN_AI_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-ai:latest}
    environment:
      <<: *service-env
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:-}
      HAN_AI_PROVIDER_QWEN_API_KEY: ${HAN_AI_PROVIDER_QWEN_API_KEY:-}
      HAN_AI_PROVIDER_DEEPSEEK_API_KEY: ${HAN_AI_PROVIDER_DEEPSEEK_API_KEY:-}
      HAN_AI_PROVIDER_OPENAI_API_KEY: ${HAN_AI_PROVIDER_OPENAI_API_KEY:-}
      HAN_AI_PROVIDER_ZHIPU_API_KEY: ${HAN_AI_PROVIDER_ZHIPU_API_KEY:-}
      HAN_AI_PROVIDER_OLLAMA_API_KEY: ${HAN_AI_PROVIDER_OLLAMA_API_KEY:-}
      HAN_AI_PROVIDER_AZURE_OPENAI_API_KEY: ${HAN_AI_PROVIDER_AZURE_OPENAI_API_KEY:-}
      HAN_AI_PROVIDER_ANTHROPIC_API_KEY: ${HAN_AI_PROVIDER_ANTHROPIC_API_KEY:-}
      HAN_AI_PROVIDER_SILICONFLOW_API_KEY: ${HAN_AI_PROVIDER_SILICONFLOW_API_KEY:-}
      # SSRF 防护（G1-12）：默认拒绝内网/环回/链路本地地址；
      # e2e 回归环境在 .env 设 AI_SSRF_ALLOWED_HOSTS=127.0.0.1 放行占位地址，生产保持默认为空
      AI_SSRF_ENABLED: ${AI_SSRF_ENABLED:-true}
      AI_SSRF_ALLOW_PRIVATE_NETWORK: ${AI_SSRF_ALLOW_PRIVATE_NETWORK:-false}
      AI_SSRF_ALLOWED_HOSTS: ${AI_SSRF_ALLOWED_HOSTS:-}
      JAVA_OPTS: -Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=0
    ports:
      - "9208:9208"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  aivideo:
    image: ${HAN_AIVIDEO_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-aivideo:latest}
    environment:
      <<: *service-env
      HAN_AIVIDEO_MEDIA_PUBLIC_FILE_ORIGIN: ${HAN_AIVIDEO_MEDIA_PUBLIC_FILE_ORIGIN:-}
      JAVA_OPTS: -Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=0
    ports:
      - "9209:9209"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - han-network

  gen:
    image: ${HAN_GEN_IMAGE:-han-gen:latest}
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  ui:
    image: ${HAN_UI_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-ui:latest}
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  nacos_data:
  rustfs_data:
  rabbitmq_data:

networks:
  han-network:
    driver: bridge
