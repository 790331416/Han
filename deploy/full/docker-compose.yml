x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: han
  DB_USER: han
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

x-nacos-env: &nacos-env
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: ""
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: han
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

x-service-env: &service-env
  <<: [*db-env, *redis-env, *nacos-env, *rabbitmq-env]
  SPRING_PROFILES_ACTIVE: docker
  HAN_DEPLOY_TIER: full
  HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:?HAN_INNER_AUTH_SECRET is required}
  JAVA_OPTS: -Xms256m -Xmx512m
  TZ: ${TZ:-Asia/Shanghai}

services:
  postgres:
    image: ${HAN_POSTGRES_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/postgres:18.1}
    restart: always
    mem_limit: ${HAN_POSTGRES_MEM_LIMIT:-1g}
    environment:
      POSTGRES_DB: han
      POSTGRES_USER: han
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ${HAN_SQL_ROOT:-../../sql}/tiers/full/full-init.sql:/docker-entrypoint-initdb.d/01-full-init.sql:ro
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U han"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${HAN_REDIS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/redis:8.6.0}
    restart: always
    mem_limit: ${HAN_REDIS_MEM_LIMIT:-512m}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: ${HAN_NACOS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/nacos:v3.1.1}
    restart: always
    mem_limit: ${HAN_NACOS_MEM_LIMIT:-1g}
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE is required}
      JVM_XMS: 512m
      JVM_XMX: 512m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  rustfs:
    image: ${HAN_RUSTFS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/rustfs:1.0.0-alpha.81}
    restart: always
    mem_limit: ${HAN_RUSTFS_MEM_LIMIT:-512m}
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-hanadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  rabbitmq:
    image: ${HAN_RABBITMQ_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/rabbitmq:3.13-management}
    restart: always
    mem_limit: ${HAN_RABBITMQ_MEM_LIMIT:-768m}
    environment:
      RABBITMQ_DEFAULT_USER: han
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    image: ${HAN_GATEWAY_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-gateway:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTED_PROXIES: .*
      HAN_DEPLOY_TIER: full
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:?HAN_INNER_AUTH_SECRET is required}
      JAVA_OPTS: -Xms256m -Xmx512m -Dio.netty.transport.noNative=true
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "9090:8080"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network
    # ui 用 service_healthy 依赖网关，这里给一个比镜像内 HEALTHCHECK 更宽松的
    # 观察窗口（120s 起步 加 8 次 15s 重试），避免网关在 Nacos 注册期间被判死。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 8

  auth:
    image: ${HAN_AUTH_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-auth:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: full
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:?HAN_INNER_AUTH_SECRET is required}
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,
        org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "9200:9200"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  system:
    image: ${HAN_SYSTEM_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-system:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: *service-env
      HAN_GEN_ENABLED: "true"
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-hanadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
    ports:
      - "9201:9201"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  tenant:
    image: ${HAN_TENANT_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-tenant:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: *service-env
    ports:
      - "9202:9202"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  workflow:
    image: ${HAN_WORKFLOW_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-workflow:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: *service-env
    ports:
      - "9203:9203"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  job:
    image: ${HAN_JOB_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-job:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: *service-env
    ports:
      - "9204:9204"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  open:
    image: ${HAN_OPEN_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-open:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: *service-env
    ports:
      - "9205:9205"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  file:
    image: ${HAN_FILE_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-file:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: [*db-env, *redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: full
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:?HAN_INNER_AUTH_SECRET is required}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-hanadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      HAN_FILE_MAX_FILE_SIZE: ${HAN_FILE_MAX_FILE_SIZE:-300MB}
      HAN_FILE_MAX_REQUEST_SIZE: ${HAN_FILE_MAX_REQUEST_SIZE:-320MB}
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "9207:9207"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - han-network

  ai:
    image: ${HAN_AI_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-ai:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: *service-env
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      VOLCENGINE_ARK_API_KEY: ${VOLCENGINE_ARK_API_KEY:-}
      HAN_AI_PROVIDER_QWEN_API_KEY: ${HAN_AI_PROVIDER_QWEN_API_KEY:-}
      HAN_AI_PROVIDER_DEEPSEEK_API_KEY: ${HAN_AI_PROVIDER_DEEPSEEK_API_KEY:-}
      HAN_AI_PROVIDER_OPENAI_API_KEY: ${HAN_AI_PROVIDER_OPENAI_API_KEY:-}
      HAN_AI_PROVIDER_ZHIPU_API_KEY: ${HAN_AI_PROVIDER_ZHIPU_API_KEY:-}
      HAN_AI_PROVIDER_OLLAMA_API_KEY: ${HAN_AI_PROVIDER_OLLAMA_API_KEY:-}
      HAN_AI_PROVIDER_AZURE_OPENAI_API_KEY: ${HAN_AI_PROVIDER_AZURE_OPENAI_API_KEY:-}
      HAN_AI_PROVIDER_ANTHROPIC_API_KEY: ${HAN_AI_PROVIDER_ANTHROPIC_API_KEY:-}
      HAN_AI_PROVIDER_SILICONFLOW_API_KEY: ${HAN_AI_PROVIDER_SILICONFLOW_API_KEY:-}
      # SSRF 防护（G1-12）：默认拒绝内网/环回/链路本地地址；
      # e2e 回归环境在 .env 设 AI_SSRF_ALLOWED_HOSTS=127.0.0.1 放行占位地址，生产保持默认为空
      AI_SSRF_ENABLED: ${AI_SSRF_ENABLED:-true}
      AI_SSRF_ALLOW_PRIVATE_NETWORK: ${AI_SSRF_ALLOW_PRIVATE_NETWORK:-false}
      AI_SSRF_ALLOWED_HOSTS: ${AI_SSRF_ALLOWED_HOSTS:-}
      JAVA_OPTS: -Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=0
    ports:
      - "9208:9208"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  # AI 短剧业务服务。generic-v2 通用底座不含 han-modules/han-aivideo，CI 也不构建
  # han-aivideo 镜像，因此这里挂在 aivideo profile 下，默认不参与 full 档启动。
  # 需要时用 `docker compose --profile aivideo up -d` 或 COMPOSE_PROFILES=aivideo 启用。
  aivideo:
    profiles:
      - aivideo
    image: ${HAN_AIVIDEO_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-aivideo:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: *service-env
      HAN_AIVIDEO_MEDIA_PUBLIC_FILE_ORIGIN: ${HAN_AIVIDEO_MEDIA_PUBLIC_FILE_ORIGIN:-}
      JAVA_OPTS: -Xms256m -Xmx512m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false -Dnetworkaddress.cache.ttl=60 -Dnetworkaddress.cache.negative.ttl=0
    ports:
      - "9209:9209"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - han-network

  gen:
    image: ${HAN_GEN_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-gen:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-1g}
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  ui:
    image: ${HAN_UI_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-ui:latest}
    restart: unless-stopped
    mem_limit: ${HAN_UI_MEM_LIMIT:-256m}
    ports:
      - "3000:80"
    depends_on:
      # service_started 只保证容器被创建，此时网关往往还没在 Nacos 注册完，
      # UI 已经对外提供服务，用户会先拿到一串 502/503。
      gateway:
        condition: service_healthy
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  nacos_data:
  rustfs_data:
  rabbitmq_data:

networks:
  han-network:
    driver: bridge
