x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: han
  DB_USER: han
  DB_PASSWORD: ${POSTGRES_PASSWORD:-han@2026}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-han@2026}

x-nacos-env: &nacos-env
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: ""
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""

x-service-env: &service-env
  <<: [*db-env, *redis-env, *nacos-env]
  SPRING_PROFILES_ACTIVE: docker
  HAN_DEPLOY_TIER: small
  HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:-han-cloud-inner-auth}
  JAVA_OPTS: -Xms128m -Xmx256m
  TZ: ${TZ:-Asia/Shanghai}

services:
  postgres:
    image: ${HAN_POSTGRES_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/postgres:18.1}
    environment:
      POSTGRES_DB: han
      POSTGRES_USER: han
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-han@2026}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ${HAN_SQL_ROOT:-../../sql}/tiers/small/postgres/system/00-schema.sql:/docker-entrypoint-initdb.d/01-system-schema.sql:ro
      - ${HAN_SQL_ROOT:-../../sql}/tiers/small/postgres/system/10-seed.sql:/docker-entrypoint-initdb.d/02-system-seed.sql:ro
      - ${HAN_SQL_ROOT:-../../sql}/tiers/small/postgres/job/00-schema.sql:/docker-entrypoint-initdb.d/03-job-schema.sql:ro
      - ${HAN_SQL_ROOT:-../../sql}/tiers/small/postgres/job/10-seed.sql:/docker-entrypoint-initdb.d/04-job-seed.sql:ro
      - ${HAN_SQL_ROOT:-../../sql}/tiers/small/postgres/job/90-fixup.sql:/docker-entrypoint-initdb.d/05-job-fix.sql:ro
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U han"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${HAN_REDIS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/redis:8.6.0}
    command: redis-server --requirepass ${REDIS_PASSWORD:-han@2026}
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-han@2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: ${HAN_NACOS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/nacos:v3.1.1}
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "aGFuQDIwMjZoYW5AMjAyNmhhbkAyMDI2aGFuQDIwMjZoYW5AMjAyNg=="
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: han2026
      JVM_XMS: 256m
      JVM_XMX: 256m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "18848:8848"
      - "19848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  gateway:
    image: ${HAN_GATEWAY_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-gateway:latest}
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: small
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:-han-cloud-inner-auth}
      JAVA_OPTS: -Xms128m -Xmx256m -Dio.netty.transport.noNative=true
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "19090:8080"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  auth:
    image: ${HAN_AUTH_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-auth:latest}
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: small
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:-han-cloud-inner-auth}
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,
        org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      JAVA_OPTS: -Xms128m -Xmx256m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "19200:9200"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  system:
    image: ${HAN_SYSTEM_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-system:latest}
    environment:
      <<: *service-env
    ports:
      - "19201:9201"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  job:
    image: ${HAN_JOB_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-job:latest}
    environment:
      <<: *service-env
    ports:
      - "19204:9204"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  ui:
    image: ${HAN_UI_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-ui:latest}
    ports:
      - "3100:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  nacos_data:

networks:
  han-network:
    driver: bridge
