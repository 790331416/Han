x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: han
  DB_USER: han
  DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  # 不要再写 driver-class-name，Spring Boot 按 URL 与 classpath 上的驱动自动选择
  DB_URL: "jdbc:mysql://mysql:3306/han?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

x-nacos-env: &nacos-env
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: ""
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""

x-service-env: &service-env
  <<: [*db-env, *redis-env, *nacos-env]
  SPRING_PROFILES_ACTIVE: docker
  HAN_DEPLOY_TIER: small
  HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:?HAN_INNER_AUTH_SECRET is required}
  JAVA_OPTS: -Xms128m -Xmx256m
  TZ: ${TZ:-Asia/Shanghai}

services:
  mysql:
    image: ${HAN_MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.4.10}
    restart: always
    mem_limit: ${HAN_MYSQL_MEM_LIMIT:-1g}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: han
      MYSQL_USER: han
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ${HAN_SQL_ROOT:-../../sql}/tiers/small/small-init-mysql.sql:/docker-entrypoint-initdb.d/01-small-init.sql:ro
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      # 首次启动要执行初始化脚本，full 档一千多行，没有宽限期会在导入期间被判 unhealthy，
      # 依赖 service_healthy 的 system/job 会因此直接启动失败。
      start_period: 180s
      retries: 10

  redis:
    image: ${HAN_REDIS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/redis:8.6.0}
    restart: always
    mem_limit: ${HAN_REDIS_MEM_LIMIT:-512m}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: ${HAN_NACOS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/nacos:v3.1.1}
    restart: always
    mem_limit: ${HAN_NACOS_MEM_LIMIT:-1g}
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE is required}
      JVM_XMS: 256m
      JVM_XMX: 256m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "18848:8848"
      - "19848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  gateway:
    image: ${HAN_GATEWAY_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-gateway:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-768m}
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: small
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:?HAN_INNER_AUTH_SECRET is required}
      JAVA_OPTS: -Xms128m -Xmx256m -Dio.netty.transport.noNative=true
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "19090:8080"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network
    # ui 用 service_healthy 依赖网关，这里给一个比镜像内 HEALTHCHECK 更宽松的
    # 观察窗口（120s 起步 加 8 次 15s 重试），避免网关在 Nacos 注册期间被判死。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 8

  auth:
    image: ${HAN_AUTH_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-auth:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-768m}
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: small
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:?HAN_INNER_AUTH_SECRET is required}
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,
        org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      JAVA_OPTS: -Xms128m -Xmx256m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "19200:9200"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  system:
    image: ${HAN_SYSTEM_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-system:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-768m}
    environment:
      <<: *service-env
    ports:
      - "19201:9201"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  job:
    image: ${HAN_JOB_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-job:latest}
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-768m}
    environment:
      <<: *service-env
    ports:
      - "19204:9204"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  ui:
    image: ${HAN_UI_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-ui:latest}
    restart: unless-stopped
    mem_limit: ${HAN_UI_MEM_LIMIT:-256m}
    ports:
      - "3100:80"
    depends_on:
      # service_started 只保证容器被创建，此时网关往往还没在 Nacos 注册完，
      # UI 已经对外提供服务，用户会先拿到一串 502/503。
      gateway:
        condition: service_healthy
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mysql_data:
  redis_data:
  nacos_data:

networks:
  han-network:
    driver: bridge
