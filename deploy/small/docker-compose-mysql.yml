x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: han
  DB_USER: han
  DB_PASSWORD: ${MYSQL_PASSWORD:-han@2026}
  DB_URL: "jdbc:mysql://mysql:3306/han?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-han@2026}

x-nacos-env: &nacos-env
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: ""
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""

x-service-env: &service-env
  <<: [*db-env, *redis-env, *nacos-env]
  SPRING_PROFILES_ACTIVE: docker
  HAN_DEPLOY_TIER: small
  HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:-han-cloud-inner-auth}
  JAVA_OPTS: -Xms128m -Xmx256m
  TZ: ${TZ:-Asia/Shanghai}

services:
  mysql:
    image: ${HAN_MYSQL_IMAGE:-mysql:8.4.10}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: han
      MYSQL_USER: han
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-han@2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-han-root@2026}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HAN_MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ${HAN_SQL_ROOT:-../../sql}/tiers/small/small-init-mysql.sql:/docker-entrypoint-initdb.d/01-small-init.sql:ro
      - ${HAN_SQL_ROOT:-../../sql}/sdfz/mysql/20260811_education_master.sql:/docker-entrypoint-initdb.d/20-sdfz-education.sql:ro
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${HAN_REDIS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/redis:8.6.0}
    command: redis-server --requirepass ${REDIS_PASSWORD:-han@2026}
    ports:
      - "${HAN_REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-han@2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: ${HAN_NACOS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/nacos:v3.1.1}
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "aGFuQDIwMjZoYW5AMjAyNmhhbkAyMDI2aGFuQDIwMjZoYW5AMjAyNg=="
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: han2026
      JVM_XMS: 256m
      JVM_XMX: 256m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HAN_NACOS_HTTP_HOST_PORT:-18848}:8848"
      - "${HAN_NACOS_GRPC_HOST_PORT:-19848}:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5

  gateway:
    image: ${HAN_GATEWAY_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-gateway:latest}
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: small
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:-han-cloud-inner-auth}
      SDFZ_CLASSROOM_GATEWAY_ENABLED: ${SDFZ_CLASSROOM_GATEWAY_ENABLED:-false}
      SDFZ_CLASSROOM_TOKEN_SECRET: ${SDFZ_CLASSROOM_TOKEN_SECRET:-}
      SDFZ_CLASSROOM_TOKEN_EXCHANGE_URI: ${SDFZ_CLASSROOM_TOKEN_EXCHANGE_URI:-http://han-auth/auth/external/digital-campus/classroom-token}
      SDFZ_THREE_CLASSROOM_GATEWAY_URI: ${SDFZ_THREE_CLASSROOM_GATEWAY_URI:-lb://three-classroom-gateway}
      JAVA_OPTS: -Xms128m -Xmx256m -Dio.netty.transport.noNative=true
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HAN_GATEWAY_HOST_PORT:-19090}:8080"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  auth:
    image: ${HAN_AUTH_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-auth:latest}
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: small
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:-han-cloud-inner-auth}
      SDFZ_DIGITAL_CAMPUS_ENABLED: ${SDFZ_DIGITAL_CAMPUS_ENABLED:-false}
      SDFZ_DIGITAL_CAMPUS_API_BASE_URL: ${SDFZ_DIGITAL_CAMPUS_API_BASE_URL:-}
      SDFZ_DIGITAL_CAMPUS_ALLOWED_ROLE_TYPES: ${SDFZ_DIGITAL_CAMPUS_ALLOWED_ROLE_TYPES:-2,5}
      SDFZ_DIGITAL_CAMPUS_TENANT_ID: ${SDFZ_DIGITAL_CAMPUS_TENANT_ID:-1}
      SDFZ_CLASSROOM_GATEWAY_ENABLED: ${SDFZ_CLASSROOM_GATEWAY_ENABLED:-false}
      SDFZ_CLASSROOM_TOKEN_SECRET: ${SDFZ_CLASSROOM_TOKEN_SECRET:-}
      SDFZ_CLASSROOM_TOKEN_TTL_SECONDS: ${SDFZ_CLASSROOM_TOKEN_TTL_SECONDS:-900}
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,
        org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      JAVA_OPTS: -Xms128m -Xmx256m
      TZ: ${TZ:-Asia/Shanghai}
    # 不映射宿主机端口：业务服务只在 han-network 内可达，一律经网关进入。
    # 服务层当前是 permitAll + 依赖网关下发的身份头，直连业务端口可绕过认证。
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  system:
    image: ${HAN_SYSTEM_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-system:latest}
    environment:
      <<: *service-env
    # 同上：不对宿主机暴露，调试请走网关或 docker exec。
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  job:
    image: ${HAN_JOB_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-job:latest}
    environment:
      <<: *service-env
    # 同上：不对宿主机暴露。
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  ui:
    image: ${HAN_UI_IMAGE:-registry.cn-hangzhou.aliyuncs.com/xzy0112/han-ui:latest}
    ports:
      - "${HAN_UI_HOST_PORT:-3100}:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mysql_data:
  redis_data:
  nacos_data:

networks:
  han-network:
    driver: bridge
