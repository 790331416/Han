services:
  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/postgres:18.1
    container_name: han-postgres
    environment:
      POSTGRES_DB: han
      POSTGRES_USER: han
      POSTGRES_PASSWORD: han@2026
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U han"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/redis:8.6-rc1
    container_name: han-redis
    command: redis-server --requirepass han@2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "han@2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: han-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  nacos-init:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/eclipse-temurin:21-jre-alpine
    container_name: han-nacos-init
    depends_on:
      nacos:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl > /dev/null 2>&1
        echo "=== Creating namespace han ==="
        curl -s -X POST "http://nacos:8848/nacos/v1/console/namespaces" \
          -d "customNamespaceId=han&namespaceName=han&namespaceDesc=han+cloud"
        echo ""
        echo "=== Nacos Init Done ==="
    networks:
      - han-network

  rustfs:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/rustfs:1.0.0-alpha.81
    container_name: han-rustfs
    environment:
      RUSTFS_ROOT_USER: hanadmin
      RUSTFS_ROOT_PASSWORD: han@2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    networks:
      - han-network

  gateway:
    build:
      context: ./han-gateway
      dockerfile: Dockerfile
    container_name: han-gateway
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ""
      NACOS_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx256m
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - han-network

  auth:
    build:
      context: ./han-auth
      dockerfile: Dockerfile
    container_name: han-auth
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ""
      NACOS_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx256m
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - han-network

  system:
    build:
      context: ./han-modules/han-system
      dockerfile: Dockerfile
    container_name: han-system
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ""
      NACOS_PASSWORD: ""
      DB_URL: jdbc:postgresql://postgres:5432/han?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: han
      DB_PASSWORD: han@2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: han@2026
      JAVA_OPTS: -Xms256m -Xmx256m
      TZ: Asia/Shanghai
    ports:
      - "9201:9201"
    depends_on:
      nacos-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - han-network

volumes:
  postgres_data:
  redis_data:
  nacos_data:
  rustfs_data:

networks:
  han-network:
    driver: bridge

