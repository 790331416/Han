# =============================================
# Han Cloud 最小部署（小型）
# 适用: 本地开发 / 快速验证
# 硬件: 2核4GB
# 基础设施: PostgreSQL 18.1 + Redis 8.6 + Nacos 3.1.1
# 服务: gateway, auth, system
# ---------------------------------------------
# 【已弃用 / 过渡保留】
# 正式部署入口是 deploy/small、deploy/medium、deploy/full（见 AGENTS.md 与
# docs/03-部署手册.md §11）。本文件只保留给本地开发过渡使用，不得用于 95 或
# 任何正式环境；三档的端口偏移、镜像清单与初始化顺序以 deploy/<tier> 为准。
# 口令等敏感项必须由环境变量注入，缺失即启动失败，参见根目录 .env.example。
# =============================================

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: han
  DB_USER: han
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

x-nacos-env: &nacos-env
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_NAMESPACE: ""
  NACOS_USERNAME: ""
  NACOS_PASSWORD: ""

x-service-env: &service-env
  <<: [*db-env, *redis-env, *nacos-env]
  SPRING_PROFILES_ACTIVE: docker
  HAN_DEPLOY_TIER: small
  HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:?HAN_INNER_AUTH_SECRET is required}
  JAVA_OPTS: -Xms128m -Xmx256m
  TZ: Asia/Shanghai

services:
  # ==================== 基础设施 ====================

  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/postgres:18.1
    restart: always
    mem_limit: ${HAN_POSTGRES_MEM_LIMIT:-1g}
    container_name: han-postgres
    environment:
      POSTGRES_DB: han
      POSTGRES_USER: han
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/tiers/small/small-init.sql:/docker-entrypoint-initdb.d/01-small-init.sql:ro
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U han"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/redis:8.6.0
    restart: always
    mem_limit: ${HAN_REDIS_MEM_LIMIT:-512m}
    container_name: han-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: registry.cn-hangzhou.aliyuncs.com/xzy0112/nacos:v3.1.1
    restart: always
    mem_limit: ${HAN_NACOS_MEM_LIMIT:-1g}
    container_name: han-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE is required}
      JVM_XMS: 256m
      JVM_XMX: 256m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - han-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  # ==================== 应用服务 ====================

  gateway:
    image: han-gateway:local
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-768m}
    pull_policy: never
    container_name: han-gateway
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: small
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:?HAN_INNER_AUTH_SECRET is required}
      JAVA_OPTS: -Xms128m -Xmx256m -Dio.netty.transport.noNative=true
      TZ: Asia/Shanghai
    ports:
      - "9090:8080"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  auth:
    image: han-auth:local
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-768m}
    pull_policy: never
    container_name: han-auth
    environment:
      <<: [*redis-env, *nacos-env]
      SPRING_PROFILES_ACTIVE: docker
      HAN_DEPLOY_TIER: small
      HAN_INNER_AUTH_SECRET: ${HAN_INNER_AUTH_SECRET:?HAN_INNER_AUTH_SECRET is required}
      SPRING_AUTOCONFIGURE_EXCLUDE: >-
        org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,
        org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      JAVA_OPTS: -Xms128m -Xmx256m
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  system:
    image: han-system:local
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-768m}
    pull_policy: never
    container_name: han-system
    environment:
      <<: *service-env
    ports:
      - "9201:9201"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

  job:
    image: han-job:local
    restart: unless-stopped
    mem_limit: ${HAN_APP_MEM_LIMIT:-768m}
    pull_policy: never
    container_name: han-job
    environment:
      <<: *service-env
    ports:
      - "9204:9204"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - han-network

volumes:
  postgres_data:
  redis_data:
  nacos_data:

networks:
  han-network:
    driver: bridge
