server {
    listen       80;
    server_name  localhost;
    # 避免无尾斜杠 API 根路径(如 POST /tenant)被 301 到绝对 URL 丢端口导致跨域 CORS
    absolute_redirect off;
    port_in_redirect off;
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;
    set $gateway_origin http://gateway:8080;

    error_page 418 = @spa_fallback;

    # 兜底安全响应头。注意 nginx 的 add_header 不会与子 location 合并：
    # 只要子 location 自己写了 add_header，这里的全部失效，所以下面每个带
    # add_header 的块都要重复声明一遍。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location ^~ /assets/ {
        alias  /usr/share/nginx/html/assets/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /favicon.ico {
        alias  /usr/share/nginx/html/favicon.ico;
        access_log off;
    }

    # SPA 入口不能被缓存：一旦 CDN 或反向代理按启发式规则缓存了旧 index.html，
    # 发版后用户会拿着旧壳去请求已删除的哈希资源，页面直接白屏。
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    location @spa_fallback {
        root   /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # API 代理到网关
    location /auth/ {
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 通知 SSE 长连接：关闭缓冲并放宽读超时，避免 ERR_INCOMPLETE_CHUNKED_ENCODING
    location = /system/notice/sse {
        proxy_pass $gateway_origin$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /system/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /tenant {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /gen/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 不带尾斜杠：前端 POST /job（新增任务）无尾斜杠，带尾斜杠前缀会漏匹配落入 SPA 301（同 /tenant）
    location /job {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /workflow/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /open/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 监控端点：调度监控面板读 /actuator/jobflow/*。缺这段会落进 SPA 兜底拿到 index.html，
    # 前端把 HTML 当成正常响应，面板永远显示 -- 且不报错。
    location /actuator/ {
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # AI 对话真流式 SSE：关闭缓冲逐 token 透传，读超时覆盖编排单流 5 分钟上限
    location = /ai/chat/stream {
        proxy_pass $gateway_origin$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /ai/chat/edit-regenerate {
        proxy_pass $gateway_origin$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /ai/chat/regenerate/ {
        proxy_pass $gateway_origin$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 编排设计器调试流式（node_start/node_delta/node_end 事件）
    location ^~ /ai/workflow/debug-stream/ {
        proxy_pass $gateway_origin$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ai/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 公开媒体代理，用于视频模型访问参考图。
    location ^~ /file/public/ {
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 文件上传代理，供前端上传角色/场景参考图后回填公开 URL。
    location /file/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        client_max_body_size 30m;
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
