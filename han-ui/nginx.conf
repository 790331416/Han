server {
    listen       80;
    server_name  localhost;
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;
    set $gateway_origin http://gateway:8080;

    error_page 418 = @spa_fallback;

    location ^~ /assets/ {
        alias  /usr/share/nginx/html/assets/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico {
        alias  /usr/share/nginx/html/favicon.ico;
        access_log off;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    location @spa_fallback {
        root   /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # API 代理到网关
    location /auth/ {
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /system/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /tenant/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /gen/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /job/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /workflow/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /open/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ai/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /aivideo/studio/text/polish/generate/stream {
        proxy_pass $gateway_origin$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /aivideo/studio/text/script/generate/stream {
        proxy_pass $gateway_origin$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /aivideo/studio/assets/extract/stream {
        proxy_pass $gateway_origin$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /aivideo/ {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass $gateway_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
